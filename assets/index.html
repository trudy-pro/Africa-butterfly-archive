<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>East Africa Butterfly Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      .butterfly-bounce {
        animation: butterfly-bounce var(--bounce-duration, 1.6s) ease-in-out var(--bounce-delay, 0s) infinite;
        display: block;
        will-change: transform;
      }

      @keyframes butterfly-bounce {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }

        42% {
          transform: translateY(calc(var(--bounce-distance, 12px) * -1)) scale(1.04);
        }

        68% {
          transform: translateY(calc(var(--bounce-distance, 12px) * 0.32)) scale(0.98);
        }
      }

      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="./assets/archive-butterflies/app.jsx?v=revised-migration-page-20260525"></script>
  </body>
</html>
